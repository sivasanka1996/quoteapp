name = "quoteapp-image-reader"
main = "image-reader.js"
compatibility_date = "2024-09-23"

# After deploying, set your Gemini API key as a secret (never in this file):
#   npx wrangler secret put GEMINI_API_KEY
#
# Then copy the deployed URL and add to your frontend .env.local:
#   VITE_IMAGE_PROXY_URL=https://quoteapp-image-reader.<your-account>.workers.dev

# --- Which model reads the photo (PI-7) -------------------------------------
#
# ACTIVE. Uncomment/edit and redeploy to change provider; edit OPENROUTER_MODEL
# in the Cloudflare dashboard to change model with NO deploy at all.
#
# An unknown AI_PROVIDER falls back to gemini and logs a warn — a typo here must
# never be why Dad cannot read a slip standing in a shop.
[vars]
AI_PROVIDER = "openrouter"
OPENROUTER_MODEL = "qwen/qwen3.5-flash-02-23"
LOG_LEVEL = "info"

# Model ids are NOT stable — verify before setting one:
#   curl -s https://openrouter.ai/api/v1/models | grep -o '"id":"[^"]*"'
# The spec's original pick, qwen/qwen3.7-flash, does not exist. Checked
# 2026-08-10: of 207 models with vision AND structured output, the cheapest
# Qwen is qwen3.5-flash-02-23 at $0.065/M in. Next rung up if Telugu accuracy
# disappoints: qwen/qwen3.6-flash ($0.188/M in).
#
# To roll back to Gemini: set AI_PROVIDER = "gemini" (or delete the line).
#
# KEYS ARE SECRETS — never put them in this file, it is committed to a PUBLIC repo:
#   npx wrangler secret put OPENROUTER_API_KEY
#   npx wrangler secret put GEMINI_API_KEY
#
# Watch reads live while testing a switch:
#   npx wrangler tail
