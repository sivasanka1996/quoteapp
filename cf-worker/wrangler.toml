name = "quoteapp-image-reader"
main = "image-reader.js"
compatibility_date = "2024-09-23"

# ---------------------------------------------------------------------------
# There is deliberately NO [vars] block here.
# ---------------------------------------------------------------------------
#
# Provider, model, token limits, allowed origins and log level are all set in
#
#     ../config/app.config.ts
#
# which this worker imports and wrangler bundles. Duplicating them here would
# recreate the exact problem that file was created to solve — two places to
# change, one of which you forget.
#
# Environment variables still OVERRIDE the config file, and that is worth
# keeping: set AI_PROVIDER or OPENROUTER_MODEL in the Cloudflare dashboard and
# the change takes effect on the very next request, with no deploy and no
# build. That is the emergency rollback path, not the normal way to configure.
#
# ---------------------------------------------------------------------------
# KEYS ARE SECRETS. Never in this file — it is committed to a PUBLIC repo.
# ---------------------------------------------------------------------------
#
#   npx wrangler secret put OPENROUTER_API_KEY    # provider = "openrouter"
#   npx wrangler secret put GEMINI_API_KEY        # provider = "gemini"
#
# Deploy, then watch reads live:
#
#   npx wrangler deploy
#   npx wrangler tail
#
# Check what will ship without uploading anything:
#
#   npx wrangler deploy --dry-run
